<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" role="img" aria-labelledby="t6">
  <title id="t6">GajaMitra deployment</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3e4c59"/></marker>
    <style>
      text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .title{font-size:22px;font-weight:700}.sub{font-size:13px;fill:#52606d}
      .h{font-size:15px;font-weight:600}.s{font-size:12px;fill:#52606d}.xs{font-size:11px;fill:#52606d}
      .lbl{font-size:11px;fill:#334e68;paint-order:stroke;stroke:#fff;stroke-width:4px}
      .line{stroke:#3e4c59;stroke-width:1.6;fill:none}
      .vm{fill:#f8fafc;stroke:#334e68;stroke-width:1.5;stroke-dasharray:10 5}
      .px{fill:#f1f5f9;stroke:#475569;stroke-width:1.5}
      .sb{fill:#ecfdf3;stroke:#15803d;stroke-width:1.5}.py{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.5}
      .inf{fill:#fffbeb;stroke:#b45309;stroke-width:1.5}
      .ext{fill:#f8fafc;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 4}
      .person{fill:#faf5ff;stroke:#7e22ce;stroke-width:1.5}.gh{fill:#ffffff;stroke:#1f2933;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1300" height="720" fill="#ffffff"/>
  <text class="title" x="40" y="44">GajaMitra · Deployment</text>
  <text class="sub" x="40" y="68">One cloud VM running docker compose. Only Caddy publishes a port; everything else is on the internal network.</text>

  <rect class="vm" x="300" y="100" width="700" height="560" rx="14"/>
  <text class="h" x="320" y="128">Cloud VM (AWS EC2 / Lightsail) · docker compose</text>

  <rect class="person" x="40" y="300" width="200" height="70" rx="10"/>
  <text class="h" x="140" y="330" text-anchor="middle">Browser</text>
  <text class="s" x="140" y="352" text-anchor="middle">officer · admin · operator</text>
  <path class="line" d="M240,335 H330" marker-end="url(#a)"/>
  <text class="lbl" x="266" y="325" text-anchor="middle">HTTPS :443</text>


  <rect class="px" x="330" y="300" width="160" height="70" rx="10"/>
  <text class="h" x="410" y="328" text-anchor="middle">caddy</text>
  <text class="xs" x="410" y="350" text-anchor="middle">TLS · the only public port</text>
  <path class="line" d="M490,335 H525 V205 H560" marker-end="url(#a)"/>
  <text class="lbl" x="530" y="275">/ and /api</text>

  <rect class="sb" x="560" y="160" width="200" height="90" rx="10"/>
  <text class="h" x="660" y="188" text-anchor="middle">backend</text>
  <text class="s" x="660" y="210" text-anchor="middle">Spring Boot + React build</text>
  <text class="xs" x="660" y="230" text-anchor="middle">:8080 internal · /mcp internal</text>

  <rect class="py" x="560" y="470" width="200" height="90" rx="10"/>
  <text class="h" x="660" y="498" text-anchor="middle">ai-service</text>
  <text class="s" x="660" y="520" text-anchor="middle">Python LangGraph worker</text>
  <text class="xs" x="660" y="540" text-anchor="middle">no listening port</text>
  <path class="line" d="M660,470 V250" marker-end="url(#a)"/>
  <text class="lbl" x="668" y="365">MCP (API key)</text>

  <rect class="inf" x="800" y="140" width="180" height="90" rx="10"/>
  <text class="h" x="890" y="166" text-anchor="middle">postgres</text>
  <text class="xs" x="890" y="186" text-anchor="middle">:5432 internal · pgdata volume</text>
  <text class="xs" x="890" y="204" text-anchor="middle">public: backend (Flyway)</text>
  <text class="xs" x="890" y="220" text-anchor="middle">langgraph: ai-service</text>
  <path class="line" d="M760,185 H800" marker-end="url(#a)"/>

  <rect class="inf" x="800" y="300" width="180" height="80" rx="10"/>
  <text class="h" x="890" y="328" text-anchor="middle">rabbitmq</text>
  <text class="xs" x="890" y="348" text-anchor="middle">:5672 AMQP internal</text>
  <text class="xs" x="890" y="364" text-anchor="middle">:15672 UI (SSH tunnel only)</text>
  <path class="line" d="M760,230 H780 V330 H800" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M760,500 H785 V360 H800" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect class="inf" x="800" y="470" width="180" height="90" rx="10"/>
  <text class="h" x="890" y="496" text-anchor="middle">videos volume</text>
  <text class="xs" x="890" y="516" text-anchor="middle">/data/videos · SAM cache</text>
  <text class="xs" x="890" y="532" text-anchor="middle">backend writes,</text>
  <text class="xs" x="890" y="546" text-anchor="middle">ai-service reads</text>

  <text class="s" x="320" y="612">Network "internal": backend, ai-service, postgres, rabbitmq. Caddy joins both networks.</text>
  <text class="s" x="320" y="632">Secrets come from .env on the VM, never from the image or the repo.</text>

  <!-- externals -->
  <rect class="ext" x="1060" y="140" width="200" height="80" rx="10"/>
  <text class="h" x="1160" y="170" text-anchor="middle">Meta Model API</text>
  <text class="xs" x="1160" y="192" text-anchor="middle">from ai-service</text>
  <rect class="ext" x="1060" y="300" width="200" height="80" rx="10"/>
  <text class="h" x="1160" y="330" text-anchor="middle">Twilio</text>
  <text class="xs" x="1160" y="352" text-anchor="middle">from backend</text>
  <rect class="ext" x="1060" y="460" width="200" height="80" rx="10"/>
  <text class="h" x="1160" y="490" text-anchor="middle">Langfuse Cloud</text>
  <text class="xs" x="1160" y="512" text-anchor="middle">from ai-service</text>
  <path class="line" d="M1000,180 H1060" marker-end="url(#a)"/>
  <path class="line" d="M1000,340 H1060" marker-end="url(#a)"/>
  <path class="line" d="M1000,500 H1060" marker-end="url(#a)"/>
  <text class="lbl" x="1030" y="172" text-anchor="middle">egress</text>
  <text class="lbl" x="1030" y="332" text-anchor="middle">egress</text>
  <text class="lbl" x="1030" y="492" text-anchor="middle">egress</text>

  <!-- CI -->
  <rect class="gh" x="30" y="440" width="250" height="200" rx="10"/>
  <text class="h" x="46" y="466">GitHub (public repo)</text>
  <text class="s" x="46" y="490">Actions CI on every push:</text>
  <text class="xs" x="46" y="512">• ai-service: ruff + pytest</text>
  <text class="xs" x="46" y="530">• backend: mvnw verify (Testcontainers)</text>
  <text class="xs" x="46" y="548">• frontend: tsc + vite build</text>
  <text class="xs" x="46" y="566">• evals: manual run (spends credits)</text>
  <text class="s" x="46" y="596">Deploy: git pull, then</text>
  <text class="s" x="46" y="614">docker compose up -d --build</text>
</svg>
