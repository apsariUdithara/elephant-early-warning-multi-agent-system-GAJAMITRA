<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t1">
  <title id="t1">GajaMitra system context</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3e4c59"/></marker>
    <style>
      text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#52606d}
      .h{font-size:19px;font-weight:600}.t{font-size:16px}.s{font-size:15px;fill:#52606d}
      .w{fill:#fff}.ws{fill:#d9e8f5;font-size:15px}
      .line{stroke:#3e4c59;stroke-width:1.6;fill:none}
      .person{fill:#faf5ff;stroke:#7e22ce;stroke-width:1.5}
      .ext{fill:#f8fafc;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 4}
      .future{fill:#fff;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:2 4}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="40" y="44">GajaMitra · System context</text>
  <text class="sub" x="40" y="68">Who uses GajaMitra and which external systems it depends on</text>

  <!-- future camera -->
  <rect class="future" x="440" y="100" width="320" height="80" rx="10"/>
  <text class="t" x="600" y="132" text-anchor="middle">Boundary camera</text>
  <text class="s" x="600" y="154" text-anchor="middle">Phase 9: live RTSP stream (today: uploaded clips)</text>
  <path class="line" d="M600,180 V250" stroke-dasharray="4 4" marker-end="url(#a)"/>

  <!-- system -->
  <rect x="440" y="250" width="320" height="220" rx="12" fill="#0b4f6c"/>
  <text class="h w" x="600" y="290" text-anchor="middle">GajaMitra</text>
  <text class="t w" x="600" y="318" text-anchor="middle">Early-warning system for</text>
  <text class="t w" x="600" y="338" text-anchor="middle">human–elephant conflict</text>
  <text class="ws" x="600" y="372" text-anchor="middle">Tracks the herd, reads its behaviour,</text>
  <text class="ws" x="600" y="390" text-anchor="middle">predicts arrival, alerts people</text>
  <text class="ws" x="600" y="424" text-anchor="middle">React · Spring Boot · Python AI worker</text>
  <text class="ws" x="600" y="442" text-anchor="middle">PostgreSQL · RabbitMQ</text>

  <!-- people -->
  <rect class="person" x="40" y="110" width="280" height="90" rx="10"/>
  <text class="h" x="60" y="140">Field operator</text>
  <text class="s" x="60" y="164">Uploads boundary-camera clips</text>
  <text class="s" x="60" y="182">and draws the village boundary</text>

  <rect class="person" x="40" y="320" width="280" height="90" rx="10"/>
  <text class="h" x="60" y="350">Wildlife officer (DWC)</text>
  <text class="s" x="60" y="374">Approves or rejects escalations,</text>
  <text class="s" x="60" y="392">receives incident reports</text>

  <rect class="person" x="40" y="530" width="280" height="90" rx="10"/>
  <text class="h" x="60" y="560">Site admin</text>
  <text class="s" x="60" y="584">Configures sites, villagers' phones,</text>
  <text class="s" x="60" y="602">shadow / live mode, approval rule</text>

  <path class="line" d="M320,155 H380 V290 H440" marker-end="url(#a)"/>
  <path class="line" d="M320,365 H440" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M320,575 H380 V440 H440" marker-end="url(#a)"/>
  <text class="s" x="380" y="357" text-anchor="middle">HTTPS</text>

  <!-- externals -->
  <rect class="ext" x="900" y="110" width="260" height="120" rx="10"/>
  <text class="h" x="920" y="140">Meta Model API</text>
  <text class="s" x="920" y="164">SAM 3.1 · elephant tracking</text>
  <text class="s" x="920" y="184">Muse Spark 1.3 · responder, verifier</text>

  <rect class="ext" x="900" y="270" width="260" height="70" rx="10"/>
  <text class="h" x="920" y="300">Langfuse Cloud</text>
  <text class="s" x="920" y="322">Agent traces, one id per analysis</text>

  <rect class="ext" x="900" y="420" width="260" height="80" rx="10"/>
  <text class="h" x="920" y="450">Twilio SMS</text>
  <text class="s" x="920" y="474">Unicode SMS in English,</text>
  <text class="s" x="920" y="490">Sinhala and Tamil</text>

  <path class="line" d="M760,280 H820 V170 H900" marker-end="url(#a)"/>
  <path class="line" d="M760,305 H900" marker-end="url(#a)"/>
  <path class="line" d="M760,455 H900" marker-end="url(#a)"/>
  <text class="s" x="860" y="162" text-anchor="middle">HTTPS</text>
  <text class="s" x="840" y="297" text-anchor="middle">traces</text>
  <text class="s" x="830" y="447" text-anchor="middle">SMS API</text>

  <!-- villagers -->
  <rect class="person" x="440" y="580" width="320" height="80" rx="10"/>
  <text class="h" x="600" y="612" text-anchor="middle">Villagers</text>
  <text class="s" x="600" y="636" text-anchor="middle">Receive alerts on their phones</text>
  <path class="line" d="M1030,500 V620 H760" marker-end="url(#a)"/>
  <text class="s" x="1040" y="565">SMS</text>

  <!-- legend -->
  <rect class="person" x="40" y="704" width="18" height="14" rx="3"/><text class="s" x="66" y="716">Person</text>
  <rect x="150" y="704" width="18" height="14" rx="3" fill="#0b4f6c"/><text class="s" x="176" y="716">GajaMitra</text>
  <rect class="ext" x="270" y="704" width="18" height="14" rx="3"/><text class="s" x="296" y="716">External system</text>
  <rect class="future" x="430" y="704" width="18" height="14" rx="3"/><text class="s" x="456" y="716">Future (not built)</text>
</svg>
