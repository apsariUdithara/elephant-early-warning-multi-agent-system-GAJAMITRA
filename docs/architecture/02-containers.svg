<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" role="img" aria-labelledby="t2">
  <title id="t2">GajaMitra containers</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3e4c59"/></marker>
    <style>
      text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .title{font-size:22px;font-weight:700}.sub{font-size:13px;fill:#52606d}
      .h{font-size:16px;font-weight:600}.t{font-size:13px;font-weight:600}.s{font-size:12px;fill:#52606d}.xs{font-size:11px;fill:#52606d}
      .lbl{font-size:11px;fill:#334e68;paint-order:stroke;stroke:#fff;stroke-width:4px}
      .line{stroke:#3e4c59;stroke-width:1.6;fill:none}
      .fe{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.5}
      .sb{fill:#ecfdf3;stroke:#15803d;stroke-width:1.5}.sbc{fill:#fff;stroke:#15803d;stroke-width:1}
      .py{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.5}.pyc{fill:#fff;stroke:#1d4ed8;stroke-width:1}
      .inf{fill:#fffbeb;stroke:#b45309;stroke-width:1.5}
      .ext{fill:#f8fafc;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 4}
      .person{fill:#faf5ff;stroke:#7e22ce;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1400" height="980" fill="#ffffff"/>
  <text class="title" x="40" y="44">GajaMitra · Containers</text>
  <text class="sub" x="40" y="68">Spring Boot owns the product and every side effect. Python owns perception and reasoning and calls Spring only through MCP.</text>

  <!-- people + frontend -->
  <rect class="person" x="100" y="90" width="300" height="70" rx="10"/>
  <text class="h" x="250" y="120" text-anchor="middle">Officer · Admin · Operator</text>
  <text class="s" x="250" y="142" text-anchor="middle">web browser</text>
  <path class="line" d="M400,125 H480" marker-end="url(#a)"/>

  <rect class="fe" x="480" y="90" width="440" height="70" rx="10"/>
  <text class="h" x="700" y="118" text-anchor="middle">React + TypeScript dashboard</text>
  <text class="s" x="700" y="141" text-anchor="middle">Vite build, served by Spring Boot (same origin)</text>
  <path class="line" d="M700,160 V230" marker-end="url(#a)"/>
  <text class="lbl" x="712" y="200">HTTPS · REST + SSE · session cookie + CSRF</text>

  <!-- spring boot -->
  <rect class="sb" x="400" y="230" width="600" height="230" rx="12"/>
  <text class="h" x="420" y="256">Spring Boot backend · Java 21</text>
  <text class="s" x="420" y="276">Users, sites, uploads, alerts, approvals, audit log</text>
  <rect class="sbc" x="415" y="292" width="180" height="66" rx="8"/>
  <text class="t" x="505" y="320" text-anchor="middle">REST API + SSE</text>
  <text class="xs" x="505" y="340" text-anchor="middle">analyses · approvals · sites</text>
  <rect class="sbc" x="610" y="292" width="180" height="66" rx="8"/>
  <text class="t" x="700" y="320" text-anchor="middle">Spring Security</text>
  <text class="xs" x="700" y="340" text-anchor="middle">session · CSRF · roles</text>
  <rect class="sbc" x="805" y="292" width="180" height="66" rx="8"/>
  <text class="t" x="895" y="320" text-anchor="middle">SMS gateway</text>
  <text class="xs" x="895" y="340" text-anchor="middle">Twilio | logging (feature flag)</text>
  <rect class="sbc" x="415" y="372" width="180" height="66" rx="8"/>
  <text class="t" x="505" y="400" text-anchor="middle">Approval timeout job</text>
  <text class="xs" x="505" y="420" text-anchor="middle">@Scheduled every 10 s</text>
  <rect class="sbc" x="610" y="372" width="180" height="66" rx="8"/>
  <text class="t" x="700" y="400" text-anchor="middle">Spring AMQP</text>
  <text class="xs" x="700" y="420" text-anchor="middle">publish jobs · consume events</text>
  <rect class="sbc" x="805" y="372" width="180" height="66" rx="8"/>
  <text class="t" x="895" y="400" text-anchor="middle">MCP server (Spring AI)</text>
  <text class="xs" x="895" y="420" text-anchor="middle">tools · internal API key</text>

  <!-- postgres -->
  <rect class="inf" x="60" y="240" width="260" height="200" rx="10"/>
  <text class="h" x="190" y="268" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="190" y="296" text-anchor="middle">schema public (Flyway):</text>
  <text class="s" x="190" y="316" text-anchor="middle">sites, analyses, alerts,</text>
  <text class="s" x="190" y="336" text-anchor="middle">approvals, audit_log</text>
  <text class="s" x="190" y="372" text-anchor="middle">schema langgraph:</text>
  <text class="s" x="190" y="392" text-anchor="middle">agent checkpoints</text>
  <path class="line" d="M400,330 H320" marker-end="url(#a)"/>
  <text class="lbl" x="360" y="322" text-anchor="middle">JPA · Flyway</text>

  <!-- shared volume -->
  <rect class="inf" x="60" y="560" width="260" height="80" rx="10"/>
  <text class="h" x="190" y="590" text-anchor="middle">Shared volume /data</text>
  <text class="s" x="190" y="614" text-anchor="middle">clips (MP4) · SAM result cache</text>
  <path class="line" d="M400,445 H360 V600 H320" marker-end="url(#a)"/>
  <text class="lbl" x="352" y="530" text-anchor="end">writes clip</text>

  <!-- rabbitmq -->
  <rect class="inf" x="480" y="530" width="440" height="100" rx="10"/>
  <text class="h" x="700" y="558" text-anchor="middle">RabbitMQ</text>
  <text class="s" x="700" y="582" text-anchor="middle">analysis.requests · analysis.resume → worker</text>
  <text class="s" x="700" y="602" text-anchor="middle">analysis.events → backend · dead-letter queue</text>
  <path class="line" d="M620,460 V530" marker-end="url(#a)"/>
  <text class="lbl" x="612" y="500" text-anchor="end">publish</text>
  <path class="line" d="M780,530 V460" marker-end="url(#a)"/>
  <text class="lbl" x="788" y="500">consume events</text>
  <path class="line" d="M620,630 V710" marker-end="url(#a)"/>
  <text class="lbl" x="612" y="675" text-anchor="end">requests · resume</text>
  <path class="line" d="M780,710 V630" marker-end="url(#a)"/>
  <text class="lbl" x="788" y="675">events</text>

  <!-- python worker -->
  <rect class="py" x="400" y="710" width="600" height="200" rx="12"/>
  <text class="h" x="420" y="736">Python AI worker · LangGraph</text>
  <text class="s" x="420" y="756">Perception and reasoning; never sends anything itself</text>
  <g>
    <rect class="pyc" x="415" y="770" width="135" height="50" rx="7"/>
    <text class="t" x="482" y="791" text-anchor="middle">perceive</text>
    <text class="xs" x="482" y="808" text-anchor="middle">SAM 3.1 · track.py</text>
    <rect class="pyc" x="560" y="770" width="135" height="50" rx="7"/>
    <text class="t" x="627" y="791" text-anchor="middle">load_context</text>
    <text class="xs" x="627" y="808" text-anchor="middle">episodic memory</text>
    <rect class="pyc" x="705" y="770" width="135" height="50" rx="7"/>
    <text class="t" x="772" y="791" text-anchor="middle">responder</text>
    <text class="xs" x="772" y="808" text-anchor="middle">Muse Spark</text>
    <rect class="pyc" x="850" y="770" width="135" height="50" rx="7"/>
    <text class="t" x="917" y="791" text-anchor="middle">verifier</text>
    <text class="xs" x="917" y="808" text-anchor="middle">Muse Spark</text>
    <rect class="pyc" x="415" y="840" width="135" height="50" rx="7"/>
    <text class="t" x="482" y="861" text-anchor="middle">policy_guard</text>
    <text class="xs" x="482" y="878" text-anchor="middle">deterministic</text>
    <rect class="pyc" x="560" y="840" width="135" height="50" rx="7"/>
    <text class="t" x="627" y="861" text-anchor="middle">dispatch</text>
    <text class="xs" x="627" y="878" text-anchor="middle">now · via MCP</text>
    <rect class="pyc" x="705" y="840" width="135" height="50" rx="7"/>
    <text class="t" x="772" y="861" text-anchor="middle">approval_gate</text>
    <text class="xs" x="772" y="878" text-anchor="middle">interrupt()</text>
    <rect class="pyc" x="850" y="840" width="135" height="50" rx="7"/>
    <text class="t" x="917" y="861" text-anchor="middle">dispatch</text>
    <text class="xs" x="917" y="878" text-anchor="middle">escalation · via MCP</text>
  </g>

  <!-- python -> spring MCP -->
  <path class="line" d="M960,710 V460" marker-end="url(#a)"/>
  <text class="lbl" x="976" y="585" text-anchor="middle" transform="rotate(-90 976 585)">MCP over HTTP · internal API key</text>

  <!-- python -> volume / checkpoints -->
  <path class="line" d="M400,760 H190 V640" marker-end="url(#a)"/>
  <text class="lbl" x="295" y="752" text-anchor="middle">reads clip</text>
  <path class="line" d="M400,890 H40 V340 H60" marker-end="url(#a)"/>
  <text class="lbl" x="220" y="882" text-anchor="middle">checkpoints (AsyncPostgresSaver)</text>

  <!-- externals -->
  <rect class="person" x="1080" y="90" width="280" height="70" rx="10"/>
  <text class="h" x="1220" y="118" text-anchor="middle">Villagers</text>
  <text class="s" x="1220" y="140" text-anchor="middle">phones, three languages</text>
  <rect class="ext" x="1080" y="240" width="280" height="80" rx="10"/>
  <text class="h" x="1220" y="268" text-anchor="middle">Twilio SMS</text>
  <text class="s" x="1220" y="290" text-anchor="middle">Unicode SMS · EN / SI / TA</text>
  <text class="xs" x="1220" y="308" text-anchor="middle">LIVE sites with the SMS flag on</text>
  <path class="line" d="M1000,280 H1080" marker-end="url(#a)"/>
  <text class="lbl" x="1040" y="272" text-anchor="middle">HTTPS</text>
  <path class="line" d="M1220,240 V160" marker-end="url(#a)"/>
  <text class="lbl" x="1228" y="205">SMS</text>

  <rect class="ext" x="1080" y="720" width="280" height="110" rx="10"/>
  <text class="h" x="1220" y="748" text-anchor="middle">Meta Model API</text>
  <text class="s" x="1220" y="772" text-anchor="middle">SAM 3.1 · Muse Spark 1.3</text>
  <text class="s" x="1220" y="792" text-anchor="middle">Muse Wonder 1.0 (eval judge)</text>
  <text class="xs" x="1220" y="814" text-anchor="middle">api.meta.ai/v1 · OpenAI-compatible</text>
  <path class="line" d="M1000,775 H1080" marker-end="url(#a)"/>
  <text class="lbl" x="1040" y="767" text-anchor="middle">HTTPS</text>

  <rect class="ext" x="1080" y="850" width="280" height="60" rx="10"/>
  <text class="h" x="1220" y="875" text-anchor="middle">Langfuse Cloud</text>
  <text class="s" x="1220" y="895" text-anchor="middle">traces · trace id = analysis id</text>
  <path class="line" d="M1000,880 H1080" marker-end="url(#a)"/>
  <text class="lbl" x="1040" y="872" text-anchor="middle">traces</text>

  <!-- legend -->
  <rect class="fe" x="40" y="940" width="18" height="14" rx="3"/><text class="s" x="66" y="952">Frontend</text>
  <rect class="sb" x="160" y="940" width="18" height="14" rx="3"/><text class="s" x="186" y="952">Spring Boot (Java)</text>
  <rect class="py" x="330" y="940" width="18" height="14" rx="3"/><text class="s" x="356" y="952">Python</text>
  <rect class="inf" x="440" y="940" width="18" height="14" rx="3"/><text class="s" x="466" y="952">Infrastructure</text>
  <rect class="ext" x="590" y="940" width="18" height="14" rx="3"/><text class="s" x="616" y="952">External service</text>
  <rect class="person" x="760" y="940" width="18" height="14" rx="3"/><text class="s" x="786" y="952">People</text>
</svg>
