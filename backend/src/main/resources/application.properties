spring.application.name=gajamitra-backend

# PostgreSQL (docker-compose.yml locally; secrets only from the environment, see .env.example)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gajamitra}
spring.datasource.username=${POSTGRES_USER:gajamitra}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway owns schema "public" (src/main/resources/db/migration). Never edit a committed migration; add a new one.
spring.flyway.locations=classpath:db/migration

# JPA maps onto the Flyway schema; it never creates or changes tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# MCP server for the AI service (plan Phase 3): streamable HTTP at /mcp, guarded by McpApiKeyFilter.
spring.ai.mcp.server.name=gajamitra
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
gajamitra.mcp.api-key=${MCP_API_KEY:}

# Dashboard users: the first ADMIN is created from these when there are no users yet (SecurityConfiguration).
gajamitra.admin.username=${GAJAMITRA_ADMIN_USERNAME:}
gajamitra.admin.password=${GAJAMITRA_ADMIN_PASSWORD:}

# Session cookie: Secure unless GAJAMITRA_SECURE_COOKIES=false (plain-HTTP local runs only); 30 min idle timeout.
server.servlet.session.cookie.secure=${GAJAMITRA_SECURE_COOKIES:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Uploads: clips are stored under generated names on the volume shared with the AI service.
gajamitra.storage.videos=${GAJAMITRA_VIDEO_DIR:data/videos}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB

# RabbitMQ (docker-compose.yml). A failing event is retried 5 times with backoff, then dead-lettered to
# analysis.dlq (never requeued forever, never dropped).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:gajamitra}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:}
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

# SMS: logged only unless GAJAMITRA_SMS_ENABLED=true; then sent through Twilio. SHADOW sites never send either way.
gajamitra.sms.enabled=${GAJAMITRA_SMS_ENABLED:false}
gajamitra.sms.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
gajamitra.sms.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
gajamitra.sms.twilio-from=${TWILIO_FROM_NUMBER:}

# Evidence frames the AI service saved (shared volume); kept 30 days, like the footage.
gajamitra.storage.evidence=${GAJAMITRA_EVIDENCE_DIR:data/evidence}
