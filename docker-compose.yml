# The GajaMitra stack (plan Phase 7): Postgres, RabbitMQ, the Spring backend and the AI worker.
# Postgres, RabbitMQ and the backend bind to 127.0.0.1 only. The web service (Caddy) is the public door: it serves the
# dashboard and forwards /api, and never forwards /mcp. Set SITE_ADDRESS to the public host name for real HTTPS and
# WEB_BIND=0.0.0.0 to open it to the network; the defaults are local only.
#   docker compose up -d --build        (needs .env, see .env.example)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gajamitra}
      POSTGRES_USER: ${POSTGRES_USER:-gajamitra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    mem_limit: 512m
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-gajamitra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gajamitra}
      POSTGRES_USER: ${POSTGRES_USER:-gajamitra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-gajamitra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      MCP_API_KEY: ${MCP_API_KEY:?set MCP_API_KEY in .env}
      GAJAMITRA_ADMIN_USERNAME: ${GAJAMITRA_ADMIN_USERNAME:-}
      GAJAMITRA_ADMIN_PASSWORD: ${GAJAMITRA_ADMIN_PASSWORD:-}
      GAJAMITRA_SECURE_COOKIES: ${GAJAMITRA_SECURE_COOKIES:-true}
      GAJAMITRA_VIDEO_DIR: /data/videos
      GAJAMITRA_EVIDENCE_DIR: /data/evidence
      GAJAMITRA_SMS_ENABLED: ${GAJAMITRA_SMS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    # Local only. Behind Caddy later, /mcp must stay unreachable from outside (plan Phase 3, Security).
    ports: ["127.0.0.1:8080:8080"]
    volumes: [videos:/data/videos, evidence:/data/evidence]  # evidence: Spring serves and purges the frames
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      retries: 20
      start_period: 20s
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    build: {context: ., dockerfile: deploy/Dockerfile.web}
    depends_on:
      backend: {condition: service_healthy}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports: ["${WEB_BIND:-127.0.0.1}:80:80", "${WEB_BIND:-127.0.0.1}:443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]  # certificates survive a restart
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  worker:
    build: {context: ., dockerfile: ai-service/Dockerfile}
    # Starts once Spring is healthy, i.e. its queues exist and /mcp answers.
    depends_on:
      backend: {condition: service_healthy}
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-gajamitra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-gajamitra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gajamitra}
      MCP_URL: http://backend:8080/mcp
      MCP_API_KEY: ${MCP_API_KEY}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    # The worker reads the clips the backend stored (same path in both containers).
    volumes: [videos:/data/videos:ro, evidence:/data/evidence]  # evidence: the worker saves the frames it looked at
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A crash loop stops after 5 tries instead of hammering the broker and the Meta API.
    restart: on-failure:5

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  videos:
  evidence:
